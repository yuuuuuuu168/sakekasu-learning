# main への push で、インフラ・問題データ・フロントエンドをまとめてデプロイする。
#
# 1. テストとビルド（AWS の認証情報を入れる前に済ませる）
# 2. cdkd deploy --all（Cognito / API / AgentCore / CloudFront）。CloudFormation を通さず API を直接呼ぶ
#    CloudFormation 管理のスタックが残っていれば、先に cdkd へ移す（初回だけ）
# 3. 問題データを非公開バケットへ同期
# 4. スタックの出力から config.json を作り、フロントエンドをサイトのバケットへ同期
# 5. CloudFront のキャッシュを削除
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# 同時デプロイを防ぐ。後続を打ち切らないのは、最後の main の状態を必ず反映させるため
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ENV_NAME: dev
  AWS_ACCOUNT_ID: '232791540685'
  # cdkd はこのロールに切り替えてから AWS を操作する（deploy ロール自身には強い権限を持たせない）
  CDKD_ROLE_ARN: arn:aws:iam::232791540685:role/sakekasu-learning-cdkd-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            web/package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      # ---- 認証前: 依存の取得・テスト・ビルド ----
      - name: 依存の取得
        run: |
          npm ci --ignore-scripts --prefix infra
          npm ci --ignore-scripts --prefix web
      - name: 問題データのビルド
        working-directory: infra
        run: npm run build:questions
      - name: エージェントのテストと梱包
        run: |
          (cd agent && uv run --group dev pytest)
          (cd infra && npm run package:agent)
      - name: インフラのテスト
        working-directory: infra
        run: npm run typecheck && npm test
      - name: フロントエンドのテストとビルド
        working-directory: web
        run: npm test && npm run build

      # ---- 認証後: デプロイ ----
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::232791540685:role/sakekasu-learning-github-actions-deploy
          aws-region: ap-northeast-1

      - name: cdkd への移行（未移行のスタックだけ）
        working-directory: infra
        run: bash scripts/cdkd-stacks.sh migrate

      - name: cdkd deploy
        working-directory: infra
        run: npx cdkd deploy --all --yes

      - name: 問題データの同期
        run: |
          DEST="s3://sakekasu-learning-${ENV_NAME}-questions-${AWS_ACCOUNT_ID}/"
          # JSON と図解（PNG）で Content-Type を分けて同期する
          aws s3 sync build/questions "$DEST" --delete --exclude "*.png" \
            --content-type application/json --cache-control no-store
          aws s3 sync build/questions "$DEST" --delete --exclude "*" --include "*.png" \
            --content-type image/png --cache-control no-store

      - name: config.json の生成
        working-directory: infra
        run: npx tsx scripts/write-web-config.ts ../web/dist/config.json

      - name: フロントエンドの同期
        run: |
          BUCKET="s3://sakekasu-learning-${ENV_NAME}-web-${AWS_ACCOUNT_ID}"
          # ハッシュ付きのファイルは長期キャッシュ、それ以外（index.html / config.json など）は毎回確認させる
          aws s3 sync web/dist/assets "${BUCKET}/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync web/dist "${BUCKET}" --delete --exclude "assets/*" \
            --cache-control "no-cache"

      - name: CloudFront のキャッシュ削除
        run: |
          DISTRIBUTION_ID=$(cd infra && npx cdkd state show "sakekasu-learning-${ENV_NAME}-web" --json \
            | jq -er '.state.outputs.DistributionId')
          aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*"
