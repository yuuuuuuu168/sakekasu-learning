# PR と main への push で、問題データの形式・インフラ・フロント・エージェントを検証する。
# AWS の認証情報は使わない。
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: npm ci --ignore-scripts
      # 問題メモの形式チェック（崩れた問題があればここで落ちる）
      - run: npm run check:questions
      - run: npm run typecheck
      # synth のテストはエージェントのパッケージを必要とする
      - run: npm run package:agent
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv run --group dev pytest
