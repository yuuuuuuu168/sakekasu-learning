[project]
name = "sakekasu-learning-tutor"
version = "0.1.0"
description = "sakekasu-learning AI tutor (AgentCore Runtime, Strands Agents)"
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore>=1.0.3",
    "boto3>=1.40.0",
    "mcp>=1.20.0",
    "pyjwt[crypto]>=2.9.0",
    "strands-agents>=1.13.0",
]

[dependency-groups]
# テスト用。Runtime への梱包（scripts/package.sh）には含めない
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
